name: '🔸 Run tests 🧪'

on:
  workflow_call:

jobs:
  test:
    name: 'Run unit tests'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: 'Handle coverage cache'
        if: matrix.node-version == 24
        uses: actions/cache@v6
        id: coverage-cache
        with:
          path: coverage/clover.xml
          key: coverage-${{ hashFiles('package.json', 'yarn.lock', 'tsconfig.json', 'src/**/*', 'test/**/*') }}

      - uses: myparcelnl/actions/yarn-install@v5
        if: steps.coverage-cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ matrix.node-version }}

      - name: 'Run typecheck'
        if: matrix.node-version == 24 && steps.coverage-cache.outputs.cache-hit != 'true'
        #language=sh
        run: |
          yarn run typecheck

      - name: 'Run tests with coverage'
        if: matrix.node-version == 24 && steps.coverage-cache.outputs.cache-hit != 'true'
        #language=sh
        run: |
          yarn test:coverage

      - name: 'Run tests'
        if: matrix.node-version != 24
        #language=sh
        run: |
          yarn test:run

      - uses: codecov/codecov-action@v7
        if: matrix.node-version == 24
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
